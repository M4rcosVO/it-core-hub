services:
  it-core-db:
    image: postgres:15-alpine
    container_name: it-core-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-GellakIT2026}
      POSTGRES_DB: it_core_hub
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d it_core_hub"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      default:
        aliases:
          - db
          - it-core-db

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: it-core-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-admin}:${DB_PASSWORD:-GellakIT2026}@db:5432/it_core_hub?schema=public
      JWT_SECRET: ${JWT_SECRET:-super-secret-key-gellak}
      PORT: 3000
    depends_on:
      it-core-db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: it-core-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db-data:
